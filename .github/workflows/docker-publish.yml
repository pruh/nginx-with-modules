name: Docker

on:
  pull_request:
    branches: ["master"]
    paths:
      - Dockerfile
      - .github/workflows/docker-publish.yml
      - tests/**
  push:
    branches: ["master"]
    paths:
      - Dockerfile
      - .github/workflows/docker-publish.yml
      - tests/**
  workflow_dispatch:

env:
  IMAGE_NAME: pruh/nginx-with-modules

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build image
        uses: docker/build-push-action@v3.2.0
        with:
          context: .
          load: true
          push: false
          tags: nginx-with-modules:test

      - name: Smoke test image
        run: tests/smoke.sh nginx-with-modules:test

  publish:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get pinned nginx version
        id: version
        shell: bash
        run: |
          image="$(sed -n 's/^ARG NGINX_IMAGE=//p' Dockerfile)"
          version="${image#nginx:}"
          version="${version%%-alpine@*}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unable to determine nginx version from NGINX_IMAGE" >&2
            exit 1
          fi
          echo "nginx_version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v2.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3.2.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:alpine
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.nginx_version }}-alpine
