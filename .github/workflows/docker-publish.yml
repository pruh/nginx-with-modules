name: Docker

on:
  pull_request:
    branches: ["master"]
    paths:
      - Dockerfile
      - .github/workflows/docker-publish.yml
      - tests/**
  push:
    branches: ["master"]
    paths:
      - Dockerfile
      - .github/workflows/docker-publish.yml
      - tests/**
  workflow_dispatch:

env:
  IMAGE_NAME: pruh/nginx-with-modules

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-validate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: type=gha,scope=validation
          cache-to: type=gha,mode=max,scope=validation
          context: .
          load: true
          pull: true
          push: false
          tags: nginx-with-modules:test

      - name: Smoke test image
        run: tests/smoke.sh nginx-with-modules:test

  publish:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Get pinned nginx version
        id: version
        shell: bash
        run: |
          image="$(sed -n 's/^ARG NGINX_IMAGE=//p' Dockerfile)"
          version="${image#nginx:}"
          version="${version%%-alpine@*}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unable to determine nginx version from NGINX_IMAGE" >&2
            exit 1
          fi
          echo "nginx_version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
          context: .
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.nginx_version }}-alpine
          provenance: mode=max
          pull: true
          push: true
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:alpine
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.nginx_version }}-alpine
