load_module /usr/lib/nginx/modules/ndk_http_module.so;
load_module /usr/lib/nginx/modules/ngx_http_set_misc_module.so;

events {}

http {
  server {
    listen 8080;

    location = / {
      set_escape_uri $escaped "a b";
      return 200 "$escaped\n";
    }

    location = /hmac {
      set_hmac_sha256 $signature secret value;
      return 204;
    }
  }
}
